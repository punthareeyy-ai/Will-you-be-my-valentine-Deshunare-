<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>🐈‍⬛ Valentine Quest</title>

  <style>
    body {
      margin: 0;
      background: linear-gradient(#cce7ff, #ffe6f0);
      font-family: "Comic Sans MS", cursive;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    canvas {
      border-radius: 20px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.25);
      z-index: 2;
    }

    .hint {
      position: absolute;
      top: 15px;
      font-size: 1.1rem;
      color: #ff4d88;
      z-index: 3;
    }

    .valentine {
      display: none;
      position: relative;
      text-align: center;
      z-index: 4;
      background: rgba(255, 255, 255, 0.92);
      padding: 30px 40px 60px;
      border-radius: 25px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      min-width: 320px;
      min-height: 240px;
    }

    button {
      font-size: 1.3rem;
      padding: 14px 30px;
      margin: 15px;
      border-radius: 35px;
      border: none;
      cursor: pointer;
    }

    #yes { background-color: #ff4d88; color: white; }
    #no  { background-color: #ccc; position: absolute; }

    .petal {
      position: fixed;
      top: -20px;
      font-size: 20px;
      animation: fall linear infinite;
      opacity: 0.85;
      z-index: 1;
    }

    @keyframes fall {
      from { transform: translateY(0) rotate(0deg); }
      to   { transform: translateY(110vh) rotate(360deg); }
    }
  </style>
</head>

<body>

<audio id="bgm" loop>
  <source src="https://incompetech.com/music/royalty-free/mp3-royaltyfree/Wallpaper.mp3" type="audio/mpeg">
</audio>

<div class="hint">⬅️ ➡️ Move | ⬆️ / Space Jump</div>

<canvas id="game" width="380" height="620"></canvas>

<div class="valentine" id="valentine">
  <h1>💘 Will you be my Valentine, Deshunare? 💘</h1>
  <p>You climbed all this way… you cannot escape 😌🐻</p>
  <button id="yes" onclick="yesClicked()">YES 💕🥰</button>
  <button id="no">NO 🙃</button>
</div>

<script>
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const music = document.getElementById("bgm");

  let musicStarted = false;
  function startMusic() {
    if (!musicStarted) {
      music.play().catch(() => {});
      musicStarted = true;
    }
  }

  let cat = { x: 180, y: 560, w: 28, h: 28, vx: 0, vy: 0 };
  let isGrounded = false;

  const gravity = 0.6;
  const jumpPower = -12;
  const speed = 4;
  const keys = {};

  const clouds = [
    { x: 40, y: 80, r: 30 },
    { x: 200, y: 120, r: 40 },
    { x: 320, y: 60, r: 25 }
  ];

  const platforms = [
    { x: 90,  y: 590, w: 200, h: 10 },
    { x: 40,  y: 520, w: 120, h: 10 },
    { x: 220, y: 480, w: 120, h: 10 },
    { x: 80,  y: 430, w: 120, h: 10 },
    { x: 200, y: 380, w: 120, h: 10 },
    { x: 50,  y: 330, w: 140, h: 10 },
    { x: 210, y: 280, w: 120, h: 10 },
    { x: 90,  y: 230, w: 140, h: 10 },
    { x: 180, y: 180, w: 120, h: 10 }
  ];

  function drawBackground() {
    const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
    sky.addColorStop(0, "#b3ddff");
    sky.addColorStop(1, "#ffe6f0");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#c1c7e5";
    ctx.beginPath();
    ctx.moveTo(0, 450);
    ctx.lineTo(80, 350);
    ctx.lineTo(160, 450);
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(120, 450);
    ctx.lineTo(240, 330);
    ctx.lineTo(360, 450);
    ctx.fill();

    ctx.fillStyle = "#b3e5cc";
    ctx.beginPath();
    ctx.arc(80, 650, 200, Math.PI, Math.PI * 2);
    ctx.arc(300, 650, 260, Math.PI, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "rgba(255,255,255,0.8)";
    clouds.forEach(c => {
      ctx.beginPath();
      ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
      ctx.arc(c.x + 25, c.y + 10, c.r - 5, 0, Math.PI * 2);
      ctx.arc(c.x - 25, c.y + 10, c.r - 10, 0, Math.PI * 2);
      ctx.fill();
      c.x += 0.1;
      if (c.x > canvas.width + 50) c.x = -50;
    });
  }

  function drawPlatforms() {
    ctx.fillStyle = "#ffb3c6";
    platforms.forEach(p => ctx.fillRect(p.x, p.y, p.w, p.h));
  }

  function drawCat() {
    ctx.font = "28px 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji'";
    ctx.fillText("🐈‍⬛", cat.x, cat.y + 28);
  }

  function update() {
    drawBackground();

    if (keys["ArrowLeft"]) cat.vx = -speed;
    else if (keys["ArrowRight"]) cat.vx = speed;
    else cat.vx = 0;

    cat.x += cat.vx;
    cat.vy += gravity;
    cat.y += cat.vy;

    isGrounded = false;

    platforms.forEach(p => {
      if (
        cat.x < p.x + p.w &&
        cat.x + cat.w > p.x &&
        cat.y + cat.h <= p.y + 10 &&
        cat.y + cat.h + cat.vy >= p.y
      ) {
        cat.vy = 0;
        cat.y = p.y - cat.h;
        isGrounded = true;
      }
    });

    if (cat.y < 160) finishGame();

    drawPlatforms();
    drawCat();
    requestAnimationFrame(update);
  }

  function jump() {
    startMusic();
    if (isGrounded) {
      cat.vy = jumpPower;
      isGrounded = false;
    }
  }

  document.addEventListener("keydown", e => {
    keys[e.code] = true;
    if (e.code === "Space" || e.code === "ArrowUp") jump();
  });

  document.addEventListener("keyup", e => keys[e.code] = false);
  document.addEventListener("touchstart", jump);

  function finishGame() {
    canvas.style.display = "none";
    document.querySelector(".hint").style.display = "none";
    document.getElementById("valentine").style.display = "block";
    enableNoEscape();
  }

  function createPetal() {
    const petal = document.createElement("div");
    petal.className = "petal";
    petal.innerText = "🌸";
    petal.style.left = Math.random() * 100 + "vw";
    petal.style.animationDuration = Math.random() * 5 + 6 + "s";
    document.body.appendChild(petal);
    setTimeout(() => petal.remove(), 11000);
  }
  setInterval(createPetal, 400);

  function enableNoEscape() {
    const noBtn = document.getElementById("no");
    const box = document.getElementById("valentine");
    noBtn.addEventListener("mousemove", () => {
      noBtn.style.left = Math.random() * (box.clientWidth - noBtn.offsetWidth) + "px";
      noBtn.style.top  = Math.random() * (box.clientHeight - noBtn.offsetHeight) + "px";
    });
  }

  function yesClicked() {
    document.getElementById("valentine").innerHTML = `
      <h1 style="color:#ff4d88;">YAYYYY 😭💘✨</h1>
      <p style="font-size:1.6rem;">You’re officially my Valentine, Deshunare 💐🥰</p>
      <p>I love you sooo much 💕🐻💞</p>
    `;
  }

  update();
</script>

</body>
</html>
